<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>project-js</title>
</head>
<body>
    <header>
        <div class="container-fluid con-1 d-flex">
            <h2 class="h2-header ml-3">Logo</h2>
        </div> <!-- / container -->
    </header>
    <div class="container d-flex justify-content-center align-items-center">
        <div class="parent p-4 shadow">
            <label class="name">First Name</label>
            <label class="name n2">Last name</label>
            <input id="first" type="text" placeholder="Enter first name" required>
            <input id="last" type="text" placeholder="Enter last name">
            <label class="label">Email</label>
            <input id="userEmail" type="email" placeholder="Enter email" required>
            <label class="label">Password</label>
            <input id="password" type="password" placeholder="Enter password" required>
            <button id="btn" type="submit" class="btn btn-primary Rounded">Register</button>
            <p class="login">Have an account?<a href="login.html"> Login</a></p>
        </div> <!-- / parent -->
    </div> <!-- / container -->
    <script src="js/data.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
