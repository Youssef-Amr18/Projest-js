<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Login</title>
</head>
<body>
    <header>
        <div class="container-fluid con-1 d-flex">
            <h2 class="h2-header ml-3">Logo</h2>
        </div> <!-- / container -->
    </header>
    <div class="container d-flex justify-content-center align-items-center">
        <div class="parent p-4 shadow">
            <label class="label">Email</label>
            <input id="email" type="email" class="form-control" placeholder="Enter Email" required>
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter password" required>
            <p class="check"><input id="rememberMe"  type="checkbox"> Remember Me</p>
            <!-- <p class="check"><input class="input-box" type="checkbox">Remember Me</p> -->
            <!-- <label>Remember Me</label> -->
            <button type="submit" id="loginBtn" class="btn btn-primary Rounded">Login</button>
            <p class="Register">Don't Have An Account? <a href="register.html">Register</a></p>
        </div> <!-- / parent -->
    </div> <!-- / container -->
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
